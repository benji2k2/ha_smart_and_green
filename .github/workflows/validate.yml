name: Validate

# HACS requires both of these to pass before a repository can be added to its
# default store, and they catch manifest mistakes that would otherwise only
# show up in someone's Home Assistant log.
on:
  push:
  pull_request:
  schedule:
    # Both actions validate against rules that change over time, so a repository
    # that passed once can start failing without a commit. Weekly is enough.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 tests/run.py
